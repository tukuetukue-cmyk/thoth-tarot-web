<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霊的カルテ ｜ パーソナル・AIレポート ── トート・タロット</title>
    <meta name="description" content="トート・タロットのリーディング結果とカバラの生命の樹を融合させた、あなただけの霊的カルテ（パーソナル・AIレポート）。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Noto+Sans+JP:wght@100;300;400;700&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- スタイルシート -->
    <link rel="stylesheet" href="src/css/styles.css?v=28">
    <link rel="stylesheet" href="src/css/tree-of-life.css?v=10">
    <link rel="stylesheet" href="src/css/spiritual-report.css?v=3">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
</head>
<body class="spiritual-report-page">
    <!-- 背景はセフィロトページと統一するためparticles-bgを削除 -->

    <div class="report-app-container">
        <!-- ヘッダーエリア -->
        <header class="report-header" style="position: relative;">
            <nav class="report-nav">
                <a href="index.html?restore=true" class="back-to-home" id="back-link">← リーディングに戻る</a>
            </nav>
            <h1 class="report-title">Spiritual Chart</h1>
            <p class="report-subtitle">霊的カルテ ｜ 生命の樹の活性状態</p>
            <!-- Language Toggle -->
            <div class="lang-toggle-container">
                <button id="lang-toggle-btn" class="lang-toggle" aria-label="Switch language">EN</button>
            </div>
        </header>

        <!-- メイン画面構成 -->
        <main class="report-main">
            <!-- 生命の樹表示セクション -->
            <div class="report-tree-section">
                <div class="tree-container" id="tree-container">
                    <svg id="tree-svg" class="tree-of-life-svg" viewBox="-30 -30 560 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                        <!-- パス（線）描画レイヤー -->
                        <g id="paths-layer"></g>
                        <!-- 深淵（アビス）レイヤー -->
                        <g id="abyss-layer"></g>
                        <!-- セフィラ（球）描画レイヤー -->
                        <g id="sephiroth-layer"></g>
                    </svg>
                </div>
            </div>

            <!-- Glassmorphism仕様 ハーフモーダル（ボトムシート） -->
            <div class="bottom-sheet" id="bottom-sheet">
                <!-- 指先でのドラッグ操作用ハンドル -->
                <div class="sheet-handle-wrapper" id="sheet-handle-wrapper">
                    <div class="sheet-handle"></div>
                </div>
                
                <!-- コンテンツ表示エリア -->
                <div class="sheet-content-wrapper" id="sheet-content-wrapper">
                    <div class="sheet-content" id="sheet-content">
                        <!-- API読み込み中のローディング表示 -->
                        <div class="report-loading" id="report-loading">
                            <div class="mystic-loader"></div>
                            <p class="loading-text">魂の階梯を辿り、真の意志を照合しています...</p>
                        </div>
                        
                        <!-- 生成されたカルテコンテンツ（ロード完了後に表示） -->
                        <div class="report-text-container hidden-section" id="report-text-container">
                            <!-- 相談者プロフィールやテーマの概要 -->
                            <div class="report-meta-info" id="report-meta-info"></div>
                            
                            <!-- カルテの本文（段落ごとに動的挿入） -->
                            <div class="report-body" id="report-body"></div>

                            <!-- 保存・コピー用アクションボタン -->
                            <div class="report-actions" style="margin-top: 3rem; display: flex; flex-direction: column; gap: 1.2rem; align-items: center; padding-bottom: 2rem;">
                                <button id="report-save-text-btn" class="mystic-btn restart-btn transparent-btn">結果を文章でコピー</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- カバラ定義＆カードデータベース -->
    <script src="src/js/cards.js?v=43"></script>
    <script src="src/js/tree-of-life.js?v=10"></script>
    <!-- 霊的カルテ専用のインタラクション・API通信スクリプト -->
    <script src="src/js/spiritual-report.js?v=6"></script>
</body>
</html>
